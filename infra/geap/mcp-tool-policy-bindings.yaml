# Apply checklist — not a Gateway resource.
# Tool-name ALLOW is per Agent Identity. The case Workflow is one principal;
# QC and supply are graph nodes, not separate Runtimes.
#
# aiplatform-sessions-allow.yaml is not identity-scoped: it allows every
# identity on countersign-egress to reach the aiplatform.googleapis.com /
# us-central1-aiplatform.googleapis.com hosts for Vertex-managed sessions
# and streamQuery/query. Required by any Runtime deployed with
# COUNTERSIGN_ALLOW_VERTEX_SESSIONS=1 (currently case_workflow). Without it,
# the case Runtime's own async_create_session call is denied
# "RBAC: access denied" — found live 2026-08-17, see
# mcp-case-workflow-tools-allow.yaml header.
bindings:
  - policy: mcp-case-workflow-tools-allow.yaml
    identity: case_workflow
    tools:
      - lims_query
      - em_query
      - coa_fetch
      - sterility_get
      - sterility_start
      - sterility_bind_resume_handle
      - prior_art_query
      - prior_art_write
      - controlled_guidance_query
      - qms_report_write
      - erpnext_nonconformance_write
      - erpnext_quality_action_write
  - policy: mcp-case-workflow-regulatory-screening-allow.yaml
    identity: case_workflow
    tools:
      - eudragmdp_screen
      - openfda_enforcement_screen
  - policy: mcp-qc-probe-lims-only.yaml
    identity: qc_probe
    tools:
      - lims_query
  - policy: mcp-sponsor-liaison-status-only.yaml
    identity: sponsor_liaison
    tools:
      - sponsor_batch_status
  - policy: mcp-cfi-workflow-tools-allow.yaml
    identity: cfi_workflow
    tools:
      - sibling_batch_query
      - cfi_open
      - cfi_get
      - cfi_save
      - chat_send_question
      - chat_read_replies
      - cfi_trend_query
      - cfi_calendar_site_review
      - cfi_report_write
  # cfi_interview_tick has no Gateway ALLOW binding at all. Cloud Scheduler
  # calls it as a direct authenticated Cloud Run caller (never through this
  # Agent Gateway), so the actual enforcement point is the caller-identity
  # check in department_server.py::_require_cfi_tick_caller, scoped by
  # COUNTERSIGN_CFI_TICK_CALLER_SERVICE_ACCOUNTS to the scheduler tick
  # service's own invoker service account. Documented here as a checklist
  # entry, not a policy file, since there is no Gateway resource to bind.
  - policy: "(none — Cloud Run caller-identity check, not a Gateway policy)"
    identity: scheduler_tick_service
    tools:
      - cfi_interview_tick
forbidden_bindings:
  - policy: mcp-qc-probe-lims-only.yaml
    identity: case_workflow
  - policy: mcp-case-workflow-regulatory-screening-allow.yaml
    identity: qc_probe
  - policy: mcp-case-workflow-regulatory-screening-allow.yaml
    identity: hello_runtime
  - policy: mcp-case-workflow-regulatory-screening-allow.yaml
    identity: sponsor_liaison
  - policy: mcp-case-workflow-tools-allow.yaml
    identity: qc_probe
  - policy: mcp-case-workflow-tools-allow.yaml
    identity: hello_runtime
  - policy: mcp-qc-probe-lims-only.yaml
    identity: hello_runtime
  - policy: mcp-sponsor-liaison-status-only.yaml
    identity: case_workflow
  - policy: mcp-sponsor-liaison-status-only.yaml
    identity: qc_probe
  - policy: mcp-sponsor-liaison-status-only.yaml
    identity: hello_runtime
  - policy: mcp-case-workflow-tools-allow.yaml
    identity: sponsor_liaison
  - policy: mcp-qc-probe-lims-only.yaml
    identity: sponsor_liaison
  - policy: mcp-cfi-workflow-tools-allow.yaml
    identity: case_workflow
  - policy: mcp-case-workflow-tools-allow.yaml
    identity: cfi_workflow
  - policy: mcp-case-workflow-regulatory-screening-allow.yaml
    identity: cfi_workflow
  - policy: mcp-qc-probe-lims-only.yaml
    identity: cfi_workflow
  - policy: mcp-sponsor-liaison-status-only.yaml
    identity: cfi_workflow
  - policy: mcp-cfi-workflow-tools-allow.yaml
    identity: qc_probe
  - policy: mcp-cfi-workflow-tools-allow.yaml
    identity: sponsor_liaison
  - policy: mcp-cfi-workflow-tools-allow.yaml
    identity: hello_runtime
  # The CFI Runtime's own Gateway ALLOW must never include the scheduler
  # control-plane tool; enforced twice — absent from
  # mcp-cfi-workflow-tools-allow.yaml above, and independently by
  # department_server.py's caller-identity check regardless of Gateway state.
  - policy: mcp-cfi-workflow-tools-allow.yaml
    identity: scheduler_tick_service
