# Native MCP tool-name ALLOW for the deviation-case Workflow Agent Identity.
# QC and supply are nodes of that one Runtime principal, so this identity
# must be allowed lims_query, em_query, coa_fetch, and drive_fetch_evidence
# (manufacturing's real Drive pull). Do not attach the qc_probe policy to
# this identity (coa_fetch would 403 on supply).
#
# sterility_start and sterility_bind_resume_handle are also included: an
# Agent Identity principal cannot be a Cloud SQL IAM database user (confirmed
# against the live instance), so the case workflow reaches the sterility
# clock through these MCP tools rather than opening Cloud SQL itself.
#
# prior_art_query and prior_art_write are Case Memory: the same identity
# constraint applies to Firestore as to Cloud SQL, so the workflow reaches
# Case Memory through this MCP process too. prior_art_redact is deliberately
# NOT included here — redaction is an operator action, not something the
# case workflow itself should be able to invoke on its own behalf.
#
# controlled_guidance_query is Doc 12 T1-5: controlled-SOP/public-guidance
# RAG. Same identity constraint applies to Vertex AI RAG Engine as to
# Firestore/Cloud SQL, so the workflow reaches it through this MCP process
# too. Read-only, its own tool name, never merged into prior_art_query.
#
# qms_report_write is the qa_qms_write_agent's one tool (file_qms_report,
# the graph's last node, runs inside this same case Runtime/identity — it is
# not a separate service like sponsor_liaison). Same Drive/Docs credential
# boundary reasoning as drive_fetch_evidence: an Agent Identity principal
# cannot itself hold a Docs/Drive OAuth credential, so this MCP process
# holds it and the tool-name allow-list is what actually scopes the case
# workflow to writing only the one report doc, never a broader Drive scope.
#
# The `hosts` match scopes this rule to the department MCP service only.
# Without it, an AuthzPolicy with action: ALLOW targeting the whole gateway
# denies every request that doesn't match one of its rules (Cloud docs:
# "if ALLOW policies exist, but there is no match, the request is denied" —
# logged as denied_as_no_allow_policies_matched_request). That is exactly
# what blocked async_create_session: the Runtime's own outbound call to the
# Vertex AI sessions API (for COUNTERSIGN_ALLOW_VERTEX_SESSIONS=1) matched no
# rule in this file and was denied "RBAC: access denied", even though the
# rule content was only ever meant to gate MCP tool calls. Scoping by host
# stops this MCP allow-list from accidentally gating non-MCP egress too.
# See aiplatform-sessions-allow.yaml for the rule that allows session
# management traffic itself.
#
# bind_to: case_workflow
# do_not_bind_to: qc_probe, hello_runtime
#
# MATCH_BASE_PROTOCOL_METHODS is required or initialize/ping are denied
# and no MCP session can be established (07_geap_platform_notes.md §10.5).
#
# A single AuthzPolicy caps out at 10 MCP methods (Gateway API hard limit,
# found live 2026-08-29 — `import` rejects anything above with
# INVALID_ARGUMENT). This file holds tools/list + the first 9 tools/call
# rules; controlled_guidance_query/case_status_upsert/qms_report_write moved
# to the sibling policy mcp-case-workflow-tools-allow-2.yaml
# (countersign-mcp-case-workflow-tools-2), same identity/host scope. Both
# must be applied for the case_workflow identity to have every tool it needs
# — see mcp-tool-policy-bindings.yaml.
name: countersign-mcp-case-workflow-tools
target:
  resources:
    - "projects/countersign-505107/locations/us-central1/agentGateways/countersign-egress"
policyProfile: REQUEST_AUTHZ
action: ALLOW
httpRules:
  - to:
      operations:
        - hosts:
            - exact: "countersign-department-mcp-sm343mxwxq-uc.a.run.app"
          mcp:
            baseProtocolMethodsOption: MATCH_BASE_PROTOCOL_METHODS
            methods:
              - name: "tools/list"
              - name: "tools/call"
                params:
                  - exact: "lims_query"
              - name: "tools/call"
                params:
                  - exact: "em_query"
              - name: "tools/call"
                params:
                  - exact: "coa_fetch"
              - name: "tools/call"
                params:
                  - exact: "drive_fetch_evidence"
              - name: "tools/call"
                params:
                  - exact: "sterility_get"
              - name: "tools/call"
                params:
                  - exact: "sterility_start"
              - name: "tools/call"
                params:
                  - exact: "sterility_bind_resume_handle"
              - name: "tools/call"
                params:
                  - exact: "prior_art_query"
              - name: "tools/call"
                params:
                  - exact: "prior_art_write"
