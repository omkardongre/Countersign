[project]
name = "countersign-tqa-spike"
version = "0.1.0"
description = "TQA ext_proc callout: tenant and lifecycle Quality Agreement"
requires-python = ">=3.11,<3.14"
dependencies = [
    "grpcio>=1.62.0,<2",
    "grpcio-health-checking>=1.62.0,<2",
    "protobuf>=5,<7",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.62.0,<2",
    "pytest>=9.0.2,<10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countersign_tqa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
