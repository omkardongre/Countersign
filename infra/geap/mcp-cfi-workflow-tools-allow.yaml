# Native MCP tool-name ALLOW for the separate CFI Workflow Agent Identity.
#
# Phase 3 is deliberately limited to the durable CFI store and tenant-locked
# sibling-batch/trend scope expansion and post-closure artifacts. The case Workflow identity is not granted
# these tools, and this CFI identity is not granted the case workflow's
# department, QMS, regulatory, or sponsor tools (see
# mcp-tool-policy-bindings.yaml).
#
# The CFI Runtime reaches the department MCP over the Agent Gateway. The
# department MCP service remains private Cloud Run; its own run.invoker check
# is an additional boundary, not a replacement for this Gateway policy.
#
# MATCH_BASE_PROTOCOL_METHODS is required or initialize/ping are denied and
# no MCP session can be established.
#
# chat_send_question and chat_read_replies (Phase 2) are the CFI interview
# tools: send one tenant-bound question/nudge to the server-configured Chat
# space, and read new thread messages as untrusted evidence. The CFI
# identity cannot choose the Chat space or responder allow-list — those are
# server-side config (COUNTERSIGN_CFI_CHAT_SPACE_MAP_JSON /
# COUNTERSIGN_CFI_CHAT_RESPONDER_MAP_JSON) — so this ALLOW only widens which
# tenant-bound interview it may act on, never which humans it may reach.
#
# cfi_interview_tick is deliberately NOT included here. It is the scheduler
# control-plane operation (claim/poll/nudge across tenants, resume metadata
# only) and must never be reachable by the CFI Workflow identity itself —
# see mcp-scheduler-cfi-tick-only.yaml and the in-process caller-identity
# check in department_server.py::_require_cfi_tick_caller, which is the
# actual enforcement point since the scheduler calls this Cloud Run service
# directly and never crosses this Gateway.
name: countersign-mcp-cfi-workflow-tools
target:
  resources:
    - "projects/countersign-505107/locations/us-central1/agentGateways/countersign-egress"
policyProfile: REQUEST_AUTHZ
action: ALLOW
httpRules:
  - to:
      operations:
        - hosts:
            - exact: "countersign-department-mcp-sm343mxwxq-uc.a.run.app"
          mcp:
            baseProtocolMethodsOption: MATCH_BASE_PROTOCOL_METHODS
            methods:
              - name: "tools/list"
              - name: "tools/call"
                params:
                  - exact: "sibling_batch_query"
              - name: "tools/call"
                params:
                  - exact: "cfi_open"
              - name: "tools/call"
                params:
                  - exact: "cfi_get"
              - name: "tools/call"
                params:
                  - exact: "cfi_save"
              - name: "tools/call"
                params:
                  - exact: "chat_send_question"
              - name: "tools/call"
                params:
                  - exact: "chat_read_replies"
              - name: "tools/call"
                params:
                  - exact: "cfi_trend_query"
              - name: "tools/call"
                params:
                  - exact: "cfi_calendar_site_review"
              - name: "tools/call"
                params:
                  - exact: "cfi_report_write"
